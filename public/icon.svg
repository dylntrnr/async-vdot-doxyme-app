<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3FBFB2"/>
      <stop offset="100%" style="stop-color:#5FD0C2"/>
    </linearGradient>
    <linearGradient id="pill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e8faf9;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Video camera body -->
  <rect x="12" y="32" width="52" height="36" rx="7" fill="white" opacity="0.95"/>
  <!-- Camera lens -->
  <circle cx="38" cy="50" r="12" fill="#3FBFB2" opacity="0.2"/>
  <circle cx="38" cy="50" r="8" fill="#3FBFB2" opacity="0.5"/>
  <circle cx="38" cy="50" r="4" fill="#1A9E94"/>
  <!-- Camera viewfinder dots -->
  <circle cx="58" cy="42" r="2" fill="#5FD0C2" opacity="0.7"/>
  <circle cx="58" cy="50" r="2" fill="#5FD0C2" opacity="0.7"/>
  <circle cx="58" cy="58" r="2" fill="#5FD0C2" opacity="0.7"/>
  <!-- Play triangle (record indicator) -->
  <polygon points="22,44 22,56 32,50" fill="#1A9E94" opacity="0.6"/>
  <!-- Camera trapezoid (lens edge) -->
  <polygon points="64,40 88,30 88,70 64,60" fill="white" opacity="0.85" rx="4"/>
  <!-- Pill shape (MAT indicator) bottom right -->
  <rect x="58" y="74" width="32" height="16" rx="8" fill="url(#pill)" stroke="white" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Pill dividing line -->
  <line x1="74" y1="74" x2="74" y2="90" stroke="#5FD0C2" stroke-width="1.5" stroke-opacity="0.5"/>
  <!-- Pill left half fill -->
  <rect x="58" y="74" width="16" height="16" rx="8" fill="#5FD0C2" opacity="0.3"/>
  <!-- Check mark overlay -->
  <polyline points="14,88 20,94 32,80" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
